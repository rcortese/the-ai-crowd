name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_SKIP_BOOTSTRAP_CODEX_SANDBOX: "true"
    permissions:
      contents: read
    concurrency:
      group: "${{ github.workflow }}-${{ github.ref }}"
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker compose -f compose.yaml -f compose.build.yaml build the-ai-crowd

      - name: Run Codex sandbox capability check
        run: bash scripts/ci/codex-sandbox.sh

      - name: Run runtime and delegation smoke tests
        run: bash scripts/ci/smoke.sh

      - name: Run healthcheck smoke tests
        run: bash scripts/ci/healthcheck.sh

      - name: Run persisted-state recovery smoke tests
        run: bash scripts/ci/smoke-upgrade.sh

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci
    uses: ./.github/workflows/publish-dockerhub.yml
    secrets: inherit
