services:
  the-ai-crowd:
    environment:
      DOCKER_ENABLE: "true"
      THE_AI_CROWD_VALIDATE_CODEX_SANDBOX: "${THE_AI_CROWD_VALIDATE_CODEX_SANDBOX:-true}"
    security_opt:
      - seccomp:unconfined
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the GID of /var/run/docker.sock on the host}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
